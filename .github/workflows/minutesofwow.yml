name: Minutes of WOW daily post

on:
  schedule:
    # GitHub often starts scheduled runs 4-5 hours late (sometimes on time),
    # so the tries are spread from midday. The first run inside the posting
    # window posts; later ones see today's post is done and stop.
    - cron: '17 7 * * *'  # 12:47 PM IST
    - cron: '47 8 * * *'  # 2:17 PM IST
    - cron: '17 10 * * *' # 3:47 PM IST
    - cron: '47 11 * * *' # 5:17 PM IST
    - cron: '17 13 * * *' # 6:47 PM IST
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: minutesofwow-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      BRAND: minutesofwow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Skip if outside posting hours or already posted today
        id: today
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          HOUR=$(TZ=Asia/Kolkata date +%-H)
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          # Scheduled posts go out between 5 PM and 11:59 PM India time.
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$HOUR" -lt 17 ] || [ "$HOUR" -gt 23 ]; }; then
            echo "done=yes" >> "$GITHUB_OUTPUT"
            echo "Outside the posting window (hour $HOUR IST)."
          # A day counts as done only after a successful post (marker commit below).
          elif git log --since="$TODAY 00:00 +0530" --format=%s | grep -q "Minutes of WOW posted $TODAY"; then
            echo "done=yes" >> "$GITHUB_OUTPUT"
            echo "Already posted today ($TODAY)."
          fi
      - if: steps.today.outputs.done != 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.today.outputs.done != 'yes'
        run: npm install sharp --no-save
      - name: Render today's product image
        if: steps.today.outputs.done != 'yes'
        run: node autopost/run.mjs --dry
      - name: Upload the image so Instagram can download it
        if: steps.today.outputs.done != 'yes'
        run: |
          git config user.name "formready-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f autopost/out
          git commit -m "Minutes of WOW image ${{ steps.today.outputs.date }}" || echo "image unchanged"
          git pull --rebase
          git push
      - name: Post to Instagram
        if: steps.today.outputs.done != 'yes'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/autopost/out
        run: node autopost/run.mjs
      - name: Mark today as posted
        if: steps.today.outputs.done != 'yes'
        run: |
          git commit --allow-empty -m "Minutes of WOW posted ${{ steps.today.outputs.date }}"
          git pull --rebase
          git push
